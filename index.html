<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iva AI Companion</title>
    <link rel="icon" href="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3e%3ccircle cx='50' cy='50' r='45' fill='%23121212' stroke='%2356b7f6' stroke-width='8'/%3e%3ctext x='50' y='68' font-family='Arial, sans-serif' font-size='50' fill='%2356b7f6' text-anchor='middle' font-weight='bold'%3eI%3c/text%3e%3c/svg%3e">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Link to your separated CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- AUTHENTICATION OVERLAY -->
    <div id="auth-section">
        <div class="auth-box">
            <div class="logo">IVA</div>

            <form id="login-form">
                <h2>Welcome Back</h2>
                <div id="login-error" class="error-msg hidden"></div>
                <input type="email" id="login-email" placeholder="Email Address" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Log In</button>
                <div class="auth-switch"><p>Don't have an account? <a href="#" id="show-register">Register here</a></p></div>
            </form>

            <form id="register-form" class="hidden">
                <h2>Create Account</h2>
                <div id="register-error" class="error-msg hidden"></div>
                <input type="text" id="register-name" placeholder="Full Name" required>
                <input type="email" id="register-email" placeholder="Email Address" required>
                <input type="password" id="register-password" placeholder="Password (min 6 chars)" required minlength="6">
                <button type="submit">Sign Up</button>
                <div class="auth-switch"><p>Already have an account? <a href="#" id="show-login">Log in here</a></p></div>
            </form>
        </div>
    </div>

    <!-- MAIN APP SECTION -->
    <div id="app-section" class="hidden">
        <header id="main-header">
            <div class="header-container">
                <div class="logo">IVA</div>

                <!-- RE-ADDED GREETING SECTION -->
                <div class="user-greeting">
                    <span id="header-user-name"></span>
                </div>

                <nav class="main-nav">

                    <!-- App-style Profile Dropdown -->
                    <div class="profile-dropdown">
                        <button id="profile-toggle-btn" class="profile-btn">
                            <i class="fas fa-user-circle profile-icon"></i>
                            <span>Profile</span>
                            <i class="fas fa-chevron-down chevron-icon"></i>
                        </button>

                        <!-- Dropdown Menu -->
                        <div id="profile-menu" class="profile-menu hidden">
                            <div class="profile-header">
                                <span class="profile-label">Signed in as</span><br>
                                <strong id="dropdown-email" class="profile-email">user@example.com</strong>
                            </div>
                            <a href="#" id="clear-chats-btn" class="profile-menu-item">
                                <i class="fas fa-trash-alt reddish-icon"></i> Clear all chats
                            </a>
                            <a href="#" id="logout-btn" class="profile-menu-item logout-item">
                                <i class="fas fa-sign-out-alt"></i> Logout
                            </a>
                        </div>
                    </div>

                </nav>
            </div>
        </header>

        <div id="app-layout">
            <!-- Sidebar for Chat History -->
            <aside id="sidebar">
                <button id="new-chat-btn"><i class="fas fa-plus"></i> New Chat</button>
                <ul id="history-list">
                    <!-- History items populated via JS -->
                </ul>

                <!-- Contact Footer Section -->
                <div class="sidebar-footer">
                    <div class="footer-title">Created by Mohd Shawez Khan</div>
                    <div class="footer-links">
                        <a href="https://github.com/shawez-04" target="_blank" class="footer-link">
                            <i class="fab fa-github"></i> GitHub
                        </a>
                        <a href="https://www.linkedin.com/in/mohd-shawez-khan" target="_blank" class="footer-link">
                            <i class="fab fa-linkedin"></i> LinkedIn
                        </a>
                    </div>
                </div>
            </aside>

            <!-- Main Chat Area -->
            <main>
                <div id="chat-window">
                    <header id="chat-header">
                        <div class="header-content">
                            <h1 class="header-title" id="chat-title-display">New Conversation</h1>
                        </div>
                        <button id="theme-toggle" title="Toggle theme"><i class="fas fa-sun"></i></button>
                    </header>

                    <div id="chat-messages"></div>
                    <form id="chat-form">
                        <input id="chat-input" type="text" placeholder="Message Iva..." autocomplete="off">
                        <button type="submit">Send</button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <!-- Link to your separated JS file -->
    <script src="script.js"></script>
</body>
</html>
